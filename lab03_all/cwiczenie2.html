<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <style>
      :root {
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-color: #1f2937;
        --accent-color: #f6bb3b;
        --border-color: #e5e7eb;
        --success-color: #10b981;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      .container {
        background-color: var(--card-bg);
        padding: 2.5rem;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 320px;
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }

      h2 {
        margin: 0;
        text-align: center;
        font-weight: 600;
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      label {
        font-size: 0.9rem;
        font-weight: 500;
        color: #4b5563;
      }

      input[type="text"],
      input[type="number"] {
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: var(--accent-color);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--accent-color);
      }

      .result-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: 0.5rem;
      }

      .result-wrapper input {
        padding-right: 40px;
        background-color: #f9fafb;
        color: #374151;
        font-family: "Courier New", monospace;
        font-weight: 600;
      }

      .copy-btn {
        position: absolute;
        right: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        transition: color 0.2s;
        border-radius: 6px;
        margin: 0;
        width: auto;
      }

      .copy-btn:hover {
        color: var(--accent-color);
        background-color: #f3f4f6;
        transform: none;
      }

      .action-btn {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
        margin-top: 0.5rem;
      }

      .action-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }

      .action-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Password Generator</h2>

      <div class="control-group">
        <label for="min-len">Min Length</label>
        <input type="number" id="min-len" value="8" min="1" />
      </div>

      <div class="control-group">
        <label for="max-len">Max Length</label>
        <input type="number" id="max-len" value="16" min="1" />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="use-caps" checked />
        <label for="use-caps">Include Uppercase</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="use-special" checked />
        <label for="use-special">Include Special Characters</label>
      </div>

      <div class="result-wrapper">
        <input
          type="text"
          id="password-output"
          readonly
          placeholder="Result will be here"
        />
        <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
            ></path>
          </svg>
        </button>
      </div>

      <button class="action-btn" id="generate-btn">Generate Password</button>
    </div>

    <script>
      const minLenInput = document.getElementById("min-len");
      const maxLenInput = document.getElementById("max-len");
      const useCapsInput = document.getElementById("use-caps");
      const useSpecialInput = document.getElementById("use-special");
      const generateBtn = document.getElementById("generate-btn");
      const passwordOutput = document.getElementById("password-output");
      const copyBtn = document.getElementById("copy-btn");

      const charsLowercase = "abcdefghijklmnopqrstuvwxyz";
      const charsUppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const charsSpecial = "!@#$%^&*()_+[]{}|;:,.<>?";
      const charsNumbers = "0123456789";

      generateBtn.addEventListener("click", () => {
        const min = parseInt(minLenInput.value);
        const max = parseInt(maxLenInput.value);
        const useCaps = useCapsInput.checked;
        const useSpecial = useSpecialInput.checked;

        if (isNaN(min) || isNaN(max) || min > max || min < 1) {
          passwordOutput.value = "Error: Check length";
          return;
        }

        let allowedChars = charsLowercase + charsNumbers;
        if (useCaps) allowedChars += charsUppercase;
        if (useSpecial) allowedChars += charsSpecial;

        const passwordLength =
          Math.floor(Math.random() * (max - min + 1)) + min;
        let password = "";

        for (let i = 0; i < passwordLength; i++) {
          const randomIndex = Math.floor(Math.random() * allowedChars.length);
          password += allowedChars[randomIndex];
        }

        passwordOutput.value = password;
      });

      copyBtn.addEventListener("click", () => {
        if (!passwordOutput.value) return;

        navigator.clipboard.writeText(passwordOutput.value).then(() => {
          const originalIcon = copyBtn.innerHTML;
          copyBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                `;

          setTimeout(() => {
            copyBtn.innerHTML = originalIcon;
          }, 2000);
        });
      });
    </script>
  </body>
</html>
