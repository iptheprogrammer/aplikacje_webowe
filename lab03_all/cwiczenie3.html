<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List</title>
    <style>
      :root {
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-color: #1f2937;
        --accent-color: #f6b53b;
        --border-color: #e5e7eb;
        --table-header-bg: #f9fafb;
      }

      body {
        margin: 0;
        padding: 40px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
      }

      .container {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 1000px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .input-group {
        flex: 1;
        min-width: 200px;
      }

      .select-group {
        min-width: 150px;
      }

      input,
      select {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        background-color: #fff;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }

      input:focus,
      select:focus {
        border-color: var(--accent-color);
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: var(--table-header-bg);
        font-weight: 600;
        color: #4b5563;
      }

      th:first-child {
        border-top-left-radius: 12px;
      }
      th:last-child {
        border-top-right-radius: 12px;
      }

      .product-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .desc-col {
        max-width: 400px;
        font-size: 0.9rem;
        color: #4b5563;
        line-height: 1.4;
      }

      .title-col {
        font-weight: 500;
      }

      #loading {
        text-align: center;
        padding: 20px;
        color: #6b7280;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Products</h2>

      <div class="controls">
        <div class="input-group">
          <input
            type="text"
            id="search-input"
            placeholder="Search products..."
          />
        </div>

        <div class="select-group">
          <select id="sort-select">
            <option value="original">Original Order</option>
            <option value="asc">Name (A-Z)</option>
            <option value="desc">Name (Z-A)</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 80px">Photo</th>
              <th style="width: 200px">Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div id="loading">Loading data...</div>
      </div>
    </div>

    <script>
      const tableBody = document.getElementById("table-body");
      const searchInput = document.getElementById("search-input");
      const sortSelect = document.getElementById("sort-select");
      const loadingMsg = document.getElementById("loading");

      let originalData = [];

      async function fetchProducts() {
        try {
          const response = await fetch("https://dummyjson.com/products");
          const data = await response.json();

          originalData = data.products.slice(0, 30);

          loadingMsg.style.display = "none";
          renderTable(originalData);
        } catch (error) {
          loadingMsg.textContent = "Error loading data.";
          console.error(error);
        }
      }

      function renderTable(products) {
        tableBody.innerHTML = "";

        if (products.length === 0) {
          tableBody.innerHTML =
            '<tr><td colspan="3" style="text-align:center;">No products found</td></tr>';
          return;
        }

        products.forEach((product) => {
          const row = document.createElement("tr");
          row.innerHTML = `
                    <td>
                        <img src="${product.thumbnail}" alt="${product.title}" class="product-img">
                    </td>
                    <td class="title-col">${product.title}</td>
                    <td class="desc-col">${product.description}</td>
                `;
          tableBody.appendChild(row);
        });
      }

      function filterAndSort() {
        const searchTerm = searchInput.value.toLowerCase();
        const sortValue = sortSelect.value;

        let filteredData = originalData.filter((item) => {
          const titleMatch = item.title.toLowerCase().includes(searchTerm);
          const descMatch = item.description.toLowerCase().includes(searchTerm);
          return titleMatch || descMatch;
        });

        if (sortValue === "asc") {
          filteredData.sort((a, b) => a.title.localeCompare(b.title));
        } else if (sortValue === "desc") {
          filteredData.sort((a, b) => b.title.localeCompare(a.title));
        }

        renderTable(filteredData);
      }

      searchInput.addEventListener("input", filterAndSort);
      sortSelect.addEventListener("change", filterAndSort);

      fetchProducts();
    </script>
  </body>
</html>
