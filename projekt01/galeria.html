<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Druga Apokalipsa — Galeria</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="brand">
          <h1>Druga Apokalipsa</h1>
          <small>R. Scott Bakker</small>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="postacie.html">Postacie</a>
          <a href="ksiazki.html">Książki</a>
          <a href="idee.html">Idee</a>
          <a href="galeria.html">Galeria</a>
          <a href="kontakt.html">Kontakt</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle">
          Zmień motyw (jasny)
        </button>
      </div>
    </header>

    <main>
      <h3 class="section-title">Obrazy</h3>
      <section class="gallery-grid">
        <img src="assets/img/1.jpg" alt="meme 1" />
        <img src="assets/img/2.jpg" alt="meme 2" />
        <img src="assets/img/3.jpg" alt="meme 3" />
        <img src="assets/img/4.jpg" alt="meme  4" />
        <img src="assets/img/5.jpg" alt="Wielkie wejście" />
        <img src="assets/img/6.jpg" alt="Nie-cłowiek" />
        <img src="assets/img/7.jpg" alt="Inchoroi" />
        <img src="assets/img/8.jpg" alt="Zobrazowanie Apokalipsy w książkach" />
        <img src="assets/img/9.jpeg" alt="Mapa fantastycznego kontynentu" />
        <img
          src="assets/img/10.jpg"
          alt="Zestaw wszytskich aktulanych książek"
        />
        <img src="assets/img/11.jpg" alt="scena magicznej walki 1" />
        <img src="assets/img/12.jpg" alt="scena magicznej walki 2" />
      </section>

      <h3 class="section-title">Film</h3>
      <section class="card">
        <video controls width="100%">
          <source src="assets/video/interview.mp4" type="video/mp4" />
          Twój przeglądarka nie obsługuje wideo.
        </video>
        <p class="muted">Wywiad i dyskusja o filozoficznych tematach cyklu.</p>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <div>Autor: Ivan Polishchuk</div>
        <div>Czas lokalny: <span id="clock"></span></div>
      </div>
    </footer>
    <script src="assets/js/main.js"></script>
  </body>
</html>
